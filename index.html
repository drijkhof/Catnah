<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no: stops pinch-zoom and double-tap
         zoom from fighting the game's own touch controls on a phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Catnah</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <!-- The page's whole style, in the page: a stylesheet of its own was one
         more round trip before anything could be drawn, most of a second on
         a phone. -->
    <style>
      :root {
        --letterbox: #0d1117;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--letterbox);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* Kill the 300ms tap delay and the pull-to-refresh / rubber-band scroll that
           otherwise interrupt dragging on a touch screen. */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }

      #game {
        line-height: 0;
      }

      #game canvas {
        /* Keep low-res pixel art crisp when the canvas is scaled up. */
        image-rendering: pixelated;
        display: block;
      }
    </style>
    <!-- The loading screen's own style, here so it shows before anything else
         has arrived: on a phone the script takes seconds. BootScene removes it. -->
    <style>
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0d1117;
        color: #ffffff;
        font-family: monospace;
        z-index: 10;
      }
      #loading b {
        font-size: 44px;
        letter-spacing: 2px;
        text-shadow: 0 3px 0 #2a1e10;
      }
      #loading i {
        font-style: normal;
        font-size: 14px;
        color: #ffd23c;
        animation: loading-pulse 1s ease-in-out infinite alternate;
      }
      @keyframes loading-pulse {
        from { opacity: 0.35; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="loading"><b>Catnah</b><i>loading...</i></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
